version: '3.8'

services:
  cv-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stanimir-cv
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge
